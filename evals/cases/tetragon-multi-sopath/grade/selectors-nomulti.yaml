apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: selectors-nomulti
spec:
  options:
  - name: disable-uprobe-multi
    value: "true"
  uprobes:
  - path: /t/targets
    symbols:
    - arg_target
    args:
    - index: 0
      type: int
    selectors:
    - matchArgs:
      - index: 0
        operator: Equal
        values: ["1"]
      matchActions:
      - action: Override
        argNewSymbol: repl
        sopath: /t/lib1.so
    - matchArgs:
      - index: 0
        operator: Equal
        values: ["2"]
      matchActions:
      - action: Override
        argNewSymbol: repl
        sopath: /t/lib2.so
    - matchArgs:
      - index: 0
        operator: Equal
        values: ["3"]
      matchActions:
      - action: Override
        argNewSymbol: arg_target_3
